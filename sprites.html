<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Find People — Sprite Gallery</title>
  <style>
    @font-face { font-family: Galmuri11; src: url('vendor/fonts/Galmuri11.woff2') format('woff2'); }
    body { background: #0a0d1a; color: #eef2ff; font-family: Galmuri11, monospace; padding: 16px; }
    h2 { color: #ffd24a; margin: 20px 0 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    canvas { image-rendering: pixelated; background: #1b2233; border: 2px solid #2e3a6a; }
    figure { margin: 0; text-align: center; font-size: 11px; color: #8e9ac0; }
  </style>
</head>
<body>
  <h1>Find People · 픽셀 스프라이트 갤러리</h1>
  <p>모든 스프라이트는 코드로 절차 생성됩니다. (<code>src/people.js</code>, <code>src/art.js</code>, <code>src/scenes.js</code>)</p>
  <h2>대상 &amp; 대역</h2><div class="row" id="target"></div>
  <h2>무작위 인물 (카드 흉상)</h2><div class="row" id="busts"></div>
  <h2>군중 스프라이트 (저해상도 9×18, 2프레임)</h2><div class="row" id="low"></div>
  <h2>아이콘</h2><div class="row" id="icons"></div>
  <h2>장소 배경</h2><div class="row" id="scenes"></div>
  <script type="module">
    import { initArt, ICON } from './src/art.js';
    import { bust, genLook, targetLook, doubleLook, buildSprites } from './src/people.js';
    import { buildScene } from './src/scenes.js';
    import { COUNTRY_POIS } from './src/data.js';
    import { mulberry32 } from './src/util.js';
    initArt();
    const put = (id, src, scale, label) => {
      const c = document.createElement('canvas');
      c.width = src.width * scale; c.height = src.height * scale;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
      const f = document.createElement('figure'); f.appendChild(c);
      if (label) { const l = document.createElement('figcaption'); l.textContent = label; f.appendChild(l); }
      document.getElementById(id).appendChild(f);
    };
    put('target', bust(targetLook(), '#3a1a1a'), 6, '김정은 (대상)');
    const r = mulberry32(42);
    for (let i = 0; i < 4; i++) put('target', bust(doubleLook(r), '#2a2a1a'), 6, '대역 #' + (i + 1));
    const groups = ['ko', 'nk', 'zh', 'ja', 'ru', 'en', 'fr', 'es', 'ar', 'in', 'af'];
    const roles = ['civ', 'civ', 'civ', 'tourist', 'guard', 'soldier', 'official', 'worker', 'skier'];
    for (let i = 0; i < 36; i++) {
      const g = groups[i % groups.length], role = roles[i % roles.length];
      const L = genLook(r, { group: g, role, nk: g === 'nk' });
      put('busts', bust(L), 3, `${g} · ${role}`);
      const s = buildSprites(L);
      for (const f of [0, 1]) { const [c, x] = [document.createElement('canvas'), null]; c.width = 9; c.height = 18; const cx = c.getContext('2d'); cx.drawImage(s.body[f], 0, 0); cx.drawImage(s.head, 0, 0); put('low', c, 5); }
    }
    for (const [k, v] of Object.entries(ICON)) put('icons', v, 4, k);
    for (const list of Object.values(COUNTRY_POIS)) for (const p of list) put('scenes', buildScene(p).bg, 1, p.name);
    for (const kind of ['village', 'beach', 'mountain']) put('scenes', buildScene({ id: 'demo_' + kind, scene: { kind, style: kind === 'mountain' ? 'green' : 'generic' } }).bg, 1, 'generic ' + kind);
  </script>
</body>
</html>
