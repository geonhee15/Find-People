<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0d1a">
  <title>Find People</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-target"><canvas id="hudTarget" width="32" height="32"></canvas><div><div class="muted small">추적 대상</div><b id="hudTargetName">-</b></div></div>
      <div class="hud-clock"><div id="hudDate">-</div><div id="hudLeft" class="small">-</div></div>
      <div class="hud-alert"><div class="small">경계도 <span id="alertNum">0%</span></div><div class="bar"><div id="alertBar"></div></div></div>
      <div class="hud-loc" id="hudLoc">-</div>
      <button id="muteBtn" class="mute" title="소리 켜기/끄기">🔊</button>
    </header>
    <main id="main">
      <div id="left">
        <section id="stage">
          <canvas id="game" width="480" height="270"></canvas>
          <canvas id="overlay"></canvas>
          <div id="loading">불러오는 중...</div>
        </section>
        <footer id="toolbar"></footer>
      </div>
      <aside id="side"><div id="panel"></div></aside>
    </main>
  </div>
  <div id="screen" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
  <script src="vendor/d3-array.min.js"></script>
  <script src="vendor/d3-geo.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
